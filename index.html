<!DOCTYPE html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TermoVolt – električne instalacije i servis</title>
  <meta name="description" content="Električne instalacije, rasveta, osigurači, klima uređaji, bela tehnika, TA peći, grejna tela i bojleri.">
  <meta property="og:title" content="TermoVolt">
  <meta property="og:image" content="img/og.jpg">
  <meta name="theme-color" content="#0B4A86">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip" href="#main" data-i18n="nav.skip">Preskoči na sadržaj</a>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="#top" aria-label="TermoVolt">
      <img src="img/logo-icon.png" alt="" width="44" height="38">
      <span>TermoVolt</span>
    </a>

    <nav class="main-nav" id="main-nav">
      <a href="#usluge" data-i18n="nav.services">Usluge</a>
      <a href="#projekti" data-i18n="nav.projects">Projekti</a>
      <a href="#o-nama" data-i18n="nav.about">O nama</a>
      <a href="#kontakt" data-i18n="nav.contact">Kontakt</a>
    </nav>

    <div class="lang" role="group" aria-label="Jezik / Језик / Sprache / Language">
      <button type="button" data-lang="sr-Cyrl" title="Српски (ћирилица)">Ћир</button>
      <button type="button" data-lang="sr-Latn" title="Srpski (latinica)">Lat</button>
      <button type="button" data-lang="de" title="Deutsch">De</button>
      <button type="button" data-lang="en" title="English">En</button>
    </div>

    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="main-nav">
      <span class="menu-bars" aria-hidden="true"></span>
      <span class="sr-only" data-i18n="nav.menu">Meni</span>
    </button>
  </div>
</header>

<main id="main">

  <!-- ================= HERO ================= -->
  <section class="hero" id="top">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <h1 data-i18n="hero.title">Električne instalacije i servis za vaš dom i posao</h1>
        <p class="hero-text" data-i18n="hero.text"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#kontakt" data-i18n="hero.cta">Pošaljite upit</a>
          <a class="btn btn-ghost js-phone-link" href="tel:">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
            <span data-i18n="hero.call">Pozovite nas</span>
          </a>
        </div>
      </div>

      <!-- Razvodna tabla: svaki osigurač vodi do jedne usluge -->
      <figure class="panel" aria-labelledby="panel-caption">
        <div class="panel-box">
          <div class="panel-brand"><img src="img/logo-icon.png" alt="" width="28" height="24"> TermoVolt</div>
          <div class="rail">
            <button class="breaker" type="button" data-target="s1"><span class="br-code">F1</span><span class="br-body"><span class="br-flag"></span><span class="br-lever"></span></span><span class="br-label" data-i18n="panel.b1"></span></button>
            <button class="breaker" type="button" data-target="s3"><span class="br-code">F3</span><span class="br-body"><span class="br-flag"></span><span class="br-lever"></span></span><span class="br-label" data-i18n="panel.b2"></span></button>
            <button class="breaker" type="button" data-target="s4"><span class="br-code">F4</span><span class="br-body"><span class="br-flag"></span><span class="br-lever"></span></span><span class="br-label" data-i18n="panel.b3"></span></button>
            <button class="breaker" type="button" data-target="s5"><span class="br-code">F5</span><span class="br-body"><span class="br-flag"></span><span class="br-lever"></span></span><span class="br-label" data-i18n="panel.b4"></span></button>
            <button class="breaker" type="button" data-target="s6"><span class="br-code">F6</span><span class="br-body"><span class="br-flag"></span><span class="br-lever"></span></span><span class="br-label" data-i18n="panel.b5"></span></button>
            <button class="breaker" type="button" data-target="s9"><span class="br-code">F9</span><span class="br-body"><span class="br-flag"></span><span class="br-lever"></span></span><span class="br-label" data-i18n="panel.b6"></span></button>
          </div>
        </div>
        <figcaption id="panel-caption" data-i18n="panel.caption"></figcaption>
      </figure>
    </div>
  </section>

  <!-- ================= USLUGE ================= -->
  <section class="services" id="usluge">
    <div class="wrap">
      <header class="section-head">
        <h2 data-i18n="services.title">Usluge</h2>
        <p data-i18n="services.lead"></p>
      </header>

      <ul class="legend">
        <li id="s1"><span class="code">F1</span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
          <div><h3 data-i18n="s1.title"></h3><p data-i18n="s1.text"></p></div></li>
        <li id="s2"><span class="code">F2</span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><rect x="9" y="7" width="6" height="10" rx="1"/></svg>
          <div><h3 data-i18n="s2.title"></h3><p data-i18n="s2.text"></p></div></li>
        <li id="s3"><span class="code">F3</span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
          <div><h3 data-i18n="s3.title"></h3><p data-i18n="s3.text"></p></div></li>
        <li id="s4"><span class="code">F4</span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><rect x="10" y="6" width="4" height="6" rx="1"/><path d="M9 16h6"/></svg>
          <div><h3 data-i18n="s4.title"></h3><p data-i18n="s4.text"></p></div></li>
        <li id="s5"><span class="code">F5</span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="9" rx="2"/><path d="M6 10h12M7 17l-1 3M12 16v4M17 17l1 3"/></svg>
          <div><h3 data-i18n="s5.title"></h3><p data-i18n="s5.text"></p></div></li>
        <li id="s6"><span class="code">F6</span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M7 5.5h2"/></svg>
          <div><h3 data-i18n="s6.title"></h3><p data-i18n="s6.text"></p></div></li>
        <li id="s7"><span class="code">F7</span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M7 10v6M11 10v6M15 10v6M8 3c0 1 1 1 1 2M13 3c0 1 1 1 1 2"/></svg>
          <div><h3 data-i18n="s7.title"></h3><p data-i18n="s7.text"></p></div></li>
        <li id="s8"><span class="code">F8</span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M9 5v14M13 5v14M17 5v14M3 19h18M3 5h18"/></svg>
          <div><h3 data-i18n="s8.title"></h3><p data-i18n="s8.text"></p></div></li>
        <li id="s9"><span class="code">F9</span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="17" rx="6"/><path d="M9 22v-3M15 22v-3M12 7v5"/></svg>
          <div><h3 data-i18n="s9.title"></h3><p data-i18n="s9.text"></p></div></li>
      </ul>
    </div>
  </section>

  <!-- ================= PROJEKTI ================= -->
  <section class="projects" id="projekti">
    <div class="wrap">
      <header class="section-head">
        <h2 data-i18n="projects.title">Projekti</h2>
        <p data-i18n="projects.lead"></p>
      </header>
      <div class="project-grid" id="project-grid" aria-live="polite"></div>
      <p class="empty" id="projects-empty" hidden data-i18n="projects.empty"></p>
    </div>
  </section>

  <!-- ================= O NAMA ================= -->
  <section class="about" id="o-nama">
    <div class="wrap about-grid">
      <div>
        <h2 data-i18n="about.title">O nama</h2>
        <p class="about-text" data-i18n="about.text"></p>
      </div>
      <dl class="principles">
        <div><dt data-i18n="about.p1.title"></dt><dd data-i18n="about.p1.text"></dd></div>
        <div><dt data-i18n="about.p2.title"></dt><dd data-i18n="about.p2.text"></dd></div>
        <div><dt data-i18n="about.p3.title"></dt><dd data-i18n="about.p3.text"></dd></div>
      </dl>
    </div>
  </section>

  <!-- ================= KONTAKT ================= -->
  <section class="contact" id="kontakt">
    <div class="wrap contact-grid">
      <div class="contact-info">
        <h2 data-i18n="contact.title">Kontakt</h2>
        <p data-i18n="contact.lead"></p>
        <dl>
          <div><dt data-i18n="contact.phone"></dt><dd><a class="js-phone-link js-phone-text" href="tel:"></a></dd></div>
          <div><dt data-i18n="contact.email"></dt><dd><a class="js-email-link" href="mailto:"></a></dd></div>
          <div><dt data-i18n="contact.area"></dt><dd class="js-area"></dd></div>
        </dl>
      </div>

      <form class="contact-form" id="contact-form" novalidate>
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
        <label><span data-i18n="form.name"></span>
          <input name="name" type="text" autocomplete="name" required></label>
        <div class="row2">
          <label><span data-i18n="form.email"></span>
            <input name="email" type="email" autocomplete="email" required></label>
          <label><span data-i18n="form.phone"></span>
            <input name="phone" type="tel" autocomplete="tel"></label>
        </div>
        <label><span data-i18n="form.service"></span>
          <select name="service" id="service-select"></select></label>
        <label><span data-i18n="form.message"></span>
          <textarea name="message" rows="5" required data-i18n-ph="form.message.ph"></textarea></label>
        <button class="btn btn-primary" type="submit" data-i18n="form.send">Pošaljite upit</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <span class="brand brand-light"><img src="img/logo-icon.png" alt="" width="32" height="27"> TermoVolt</span>
    <span>© <span id="year"></span> TermoVolt. <span data-i18n="footer.rights"></span></span>
  </div>
</footer>

<!-- Pregled slika projekta -->
<dialog class="lightbox" id="lightbox">
  <button class="lb-close" type="button" data-i18n-aria="projects.close">×</button>
  <button class="lb-nav lb-prev" type="button" data-i18n-aria="projects.prev">‹</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption id="lb-caption"></figcaption>
  </figure>
  <button class="lb-nav lb-next" type="button" data-i18n-aria="projects.next">›</button>
</dialog>

<script src="config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
